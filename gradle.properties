# Metaspace under 1024m OOMs in compileReleaseKotlin: the in-process strategy
# reloads the compiler into one daemon for test+lint+debug+release.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
